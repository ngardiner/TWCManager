name: "Create Docker Image"

on:
  push:
    branches:
      - 'ci_dev'
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: The version that you would like to create a release for.
        required: true
        default: "v1.3.2"
      trigger_docker_latest_cloud:
        description: Generate a :latest docker image using cloud compute.
        required: true
        default: "no"
      trigger_docker_release_cloud:
        description: Generate docker release build (using release_version) via cloud.
        required: true
        default: "no"
      trigger_docker_testing_cloud:
        description: Allows generating a :testing docker image using cloud runners.
        required: true
        default: "no"

jobs:
  docker-latest:
    name: Create docker-latest Docker Image from current head
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_docker_latest_cloud == 'yes')

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4
      with:
        path: ./docker-latest

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
      id: buildx

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: ./docker-latest/contrib/docker
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: twcmanager/twcmanager:latest

  docker-release:
    name: Create docker-release Docker Image for release version
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_docker_release_cloud == 'yes')

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4
      with:
        path: ./docker-release

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
      id: buildx

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Work out image tags
      id: tags
      working-directory: ./docker-release
      env:
        REF: ${{ github.event.inputs.release_version || github.ref_name }}
      run: |
        git fetch --tags --quiet
        # The exact release, plus the tags users pin that should follow it:
        # v1.3.4 picks up v1.3.4.postN, and v1.3 the newest 1.3.x
        base="${REF%%.post*}"
        minor="$(echo "$base" | cut -d. -f1,2)"
        tags="twcmanager/twcmanager:$REF"
        [ "$base" != "$REF" ] && tags="$tags,twcmanager/twcmanager:$base"
        newest="$(git tag -l "$minor.*" | sed 's/\.post.*//' | sort -V | tail -1)"
        [ "$base" = "$newest" ] && tags="$tags,twcmanager/twcmanager:$minor"
        echo "tags=$tags" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: ./docker-release/contrib/docker
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        build-args: TWC_REF=${{ github.event.inputs.release_version || github.ref_name }}
        tags: ${{ steps.tags.outputs.tags }}

  docker-testing-cloud:
    name: Create docker-testing Docker Image (Cloud)
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_docker_testing_cloud == 'yes'

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
      id: buildx

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: ./contrib/docker
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        build-args: TWC_REF=${{ github.ref_name }}
        tags: twcmanager/twcmanager:testing
